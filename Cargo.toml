[package]
name = "chirp-auth-client"
version = "0.16.0"
edition = "2021"
description = "Shared client-side library for ChirpAuth: ID-token verification plus machine-token minting."
license = "MIT OR Apache-2.0"
repository = "https://github.com/chirpauth/client-rust"
documentation = "https://docs.rs/chirp-auth-client"
readme = "README.md"
keywords = ["oidc", "jwt", "auth", "chirp-auth"]
categories = ["authentication", "web-programming"]

[dependencies]
base64 = "0.22"
# The platform-canonical `Environment` (Prod | Test{tenant}) lives here and is
# re-exported, so there is ONE definition of the prod/test boundary rather than
# a tenant-less fork in this crate. `capability` is a leaf crate (its only dep
# is optional serde), so this adds no transitive weight.
capability = { git = "https://github.com/stackwell-labs/capability.git", tag = "v0.4.0", default-features = false }
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
time = { version = "0.3", features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util"] }
# Test-only: mint signed tokens + serve a JWKS to exercise the verify path
# end-to-end (the existing test module only covered malformed-shortcut
# paths that never reached the JWKS fetch or signature check).
rsa = { version = "0.9", default-features = false, features = ["sha2", "std"] }
sha2 = "0.10"
rand = "0.8"
proptest = "1"
